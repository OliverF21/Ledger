<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Same 150deg as the sidebar tile, pushed far enough to read in the dock. -->
    <linearGradient id="tile" x1="22%" y1="0%" x2="78%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e4eefb"/>
      <stop offset="100%" stop-color="#b7ccee"/>
    </linearGradient>
    <!-- Ink wash on the BookOpen stroke — steel at the light corner, #0a0c10 at the dark. -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="3" y1="2" x2="21" y2="22">
      <stop offset="0%" stop-color="#4a6ca8"/>
      <stop offset="55%" stop-color="#1a2740"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.45" stdDeviation="0.6" flood-color="#7a9bc8" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <g transform="translate(242 242) scale(22.5)"
     fill="none" stroke="url(#ink)" stroke-width="2.25"
     stroke-linecap="round" stroke-linejoin="round"
     filter="url(#bookShadow)">
    <path d="M12 7v14"/>
    <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
  </g>
</svg>
