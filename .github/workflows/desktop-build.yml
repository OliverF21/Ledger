name: Desktop build

# Builds unsigned desktop bundles on each platform's native runner.
# macOS → .app/.dmg, Windows → NSIS .exe installer. Artifacts are uploaded
# for download. Signed release builds (with auto-update artifacts) require the
# TAURI_SIGNING_PRIVATE_KEY secret; without it the build is plain/unsigned.

# Manual, unsigned test builds. Tagged releases go through release.yml (signed
# + auto-update artifacts).
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
            artifact: ledger-macos
            path: |
              desktop/src-tauri/target/release/bundle/macos/*.app
          - os: windows-latest
            bundles: nsis
            artifact: ledger-windows
            path: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Bundle backend (PyInstaller)
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          pyinstaller ledger.spec --noconfirm

      - name: Install desktop deps
        working-directory: desktop
        run: npm install

      - name: Build Tauri bundle
        working-directory: desktop
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
