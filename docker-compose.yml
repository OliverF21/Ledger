version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger_user
      # Dev-only default; production uses docker-compose.prod.yml which
      # requires POSTGRES_PASSWORD to be set explicitly.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d ledger"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ledger-backend
    environment:
      DATABASE_URL: postgresql://ledger_user:${POSTGRES_PASSWORD:-ledger_password}@postgres:5432/ledger
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
      PLAID_SANDBOX_SECRET: ${PLAID_SANDBOX_SECRET}
      PLAID_PROD_SECRET: ${PLAID_PROD_SECRET}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      API_KEY: ${API_KEY:-}
      AUTH_TOKEN_KEY: ${AUTH_TOKEN_KEY:-}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BACKEND_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-6}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ledger-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
